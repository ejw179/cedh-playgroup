name: Import pod results

# About every 10 minutes: pull results submitted on the site (via the Apps Script
# endpoint in data/config.json), record them in data/games.json, and if
# anything changed, commit and rebuild the site.
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"  # off the hour marks, which GitHub often drops when busy
  workflow_dispatch:
    inputs:
      announce_since:
        description: "Post to Discord everything new since this commit (default: only this run's changes)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: import-results
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      CEDH_PLAYGROUP_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # announce.py compares with earlier commits

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import new results
        working-directory: cedh-playgroup/scripts
        run: python import_results.py

      # "Plan a session" requests: building pods needs the TopDeck cache for seat
      # and matchup data, so restore the one the site build saved (or sync if none).
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: topdeck-cache-${{ github.run_id }}
          restore-keys: topdeck-cache-

      - name: Plan requested sessions
        working-directory: cedh-playgroup/scripts
        env:
          TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
        run: |
          if python plan_sessions.py --pending; then
            [ -f "$CEDH_PLAYGROUP_DIR/cache/tournaments.json" ] || python sync.py --days 90
            python plan_sessions.py
          else
            echo "No new session requests."
          fi

      # New pods and new results go to the group's Discord channel (skipped if the
      # DISCORD_WEBHOOK_URL secret isn't set). A Discord hiccup never blocks the commit.
      - name: Post new pods and results to Discord
        working-directory: cedh-playgroup/scripts
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SINCE: ${{ inputs.announce_since }}
        run: python announce.py ${SINCE:+--ref "$SINCE"}

      - name: Commit and rebuild if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then  # also sees new files, e.g. the first games.json
            echo "No new results."
            exit 0
          fi
          git config user.name "cedh-playgroup bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in games roster pods availability; do  # games.json doesn't exist until the first result
            [ -f "data/$f.json" ] && git add "data/$f.json"
          done
          git commit -m "Import results and session requests from the site"
          git push
          # pushes made with this token don't trigger other workflows, so start the site build directly
          gh workflow run site.yml --ref main
